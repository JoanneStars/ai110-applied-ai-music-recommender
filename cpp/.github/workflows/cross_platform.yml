name: VibeMatch Cross-Platform Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        run: python -m pip install pytest streamlit
      - name: Configure C++17 backend
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native backend
        run: cmake --build cpp/build --config Release
      - name: Verify native backend loads
        run: python -c "from src.native_distance import DistanceBackend; b=DistanceBackend(); print(b.backend); assert b.backend == 'C++17 native'"
      - name: Full Python test suite and native parity tests
        run: python -m pytest -v
      - name: Validate ten baseline reliability checks
        run: python -m src.evaluator
